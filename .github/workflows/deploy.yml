name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # rebuild every day so new YouTube uploads show up on their own
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        env:
          # optional: add a YOUTUBE_API_KEY repo secret if YouTube's RSS feed is unreliable
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
